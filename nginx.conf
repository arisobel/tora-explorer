server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/sefaria/ {
    proxy_pass https://www.sefaria.org/api/v3/texts/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.sefaria.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Dados e ícones: revalidar a cada request (ETag) para deploys aparecerem na hora
  location ~* \.(?:json|svg)$ {
    add_header Cache-Control "no-cache";
  }

  # Ilustrações podem cachear por mais tempo
  location ~* \.(?:png|jpe?g|webp)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
